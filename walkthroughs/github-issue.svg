<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Illustration of a GitHub new issue form</title><desc id="d">A custom teaching illustration showing an issue title, description with acceptance checks, labels, and the Submit new issue button.</desc><rect width="1200" height="620" rx="18" fill="#fff"/><rect width="1200" height="68" rx="18" fill="#161616"/><rect y="50" width="1200" height="18" fill="#161616"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">GitHub</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="15" fill="#555">my-resume-site / Issues / New issue</text><text x="40" y="157" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#222">New issue</text><rect x="40" y="183" width="790" height="54" rx="7" fill="#fff" stroke="#888" stroke-width="2"/><text x="62" y="216" font-family="Arial,sans-serif" font-size="17" fill="#222">Add one featured project card</text><rect x="40" y="253" width="790" height="238" rx="9" fill="#fff" stroke="#ccc"/><rect x="40" y="253" width="790" height="44" rx="9" fill="#f6f8fa"/><rect x="40" y="284" width="790" height="13" fill="#f6f8fa"/><text x="62" y="281" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#222">Write</text><text x="124" y="281" font-family="Arial,sans-serif" font-size="15" fill="#555">Preview</text><text x="62" y="328" font-family="Arial,sans-serif" font-size="16" fill="#222">Add one project card to the portfolio so visitors can quickly</text><text x="62" y="354" font-family="Arial,sans-serif" font-size="16" fill="#222">understand a project I worked on.</text><text x="62" y="397" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#222">Acceptance checks</text><text x="62" y="427" font-family="Arial,sans-serif" font-size="15" fill="#333">• A clear title and short summary are visible.</text><text x="62" y="454" font-family="Arial,sans-serif" font-size="15" fill="#333">• The project link opens successfully.</text><text x="62" y="480" font-family="Arial,sans-serif" font-size="15" fill="#333">• The card fits on a phone screen.</text><rect x="40" y="515" width="250" height="49" rx="7" fill="#1f883d"/><text x="74" y="545" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Submit new issue</text><rect x="870" y="183" width="290" height="230" rx="9" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><text x="895" y="219" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#222">Make the task clear</text><text x="895" y="253" font-family="Arial,sans-serif" font-size="15" fill="#333">1. What should change?</text><text x="895" y="285" font-family="Arial,sans-serif" font-size="15" fill="#333">2. What does “done” mean?</text><text x="895" y="317" font-family="Arial,sans-serif" font-size="15" fill="#333">3. How will you check it?</text><text x="895" y="375" font-family="Arial,sans-serif" font-size="13" fill="#555">Keep the task small.</text><text x="40" y="605" font-family="Arial,sans-serif" font-size="13" fill="#666">CUSTOM LEARNING ILLUSTRATION · GITHUB MAY UPDATE THE FORM</text></svg>