<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Illustration of a GitHub pull request</title><desc id="d">A custom teaching illustration shows a pull request title, branch comparison, file diff, and merge button.</desc><rect width="1200" height="640" rx="16" fill="#fff"/><rect width="1200" height="65" rx="16" fill="#171717"/><rect y="48" width="1200" height="17" fill="#171717"/><text x="30" y="41" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">GitHub</text><text x="40" y="111" font-family="Arial,sans-serif" font-size="16" fill="#555">my-resume-site / Pull requests / New pull request</text><text x="40" y="161" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176b36">Add featured project card</text><rect x="40" y="183" width="83" height="30" rx="15" fill="#e0f3e5"/><text x="58" y="203" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#22763a">Open</text><text x="140" y="203" font-family="Arial,sans-serif" font-size="14" fill="#555">feature/project-card → main</text><path d="M40 237H1160" stroke="#ddd" stroke-width="2"/><text x="48" y="277" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#222">Conversation</text><text x="188" y="277" font-family="Arial,sans-serif" font-size="16" fill="#555">Commits  Files changed  Checks</text><rect x="40" y="300" width="700" height="192" rx="9" fill="#fff" stroke="#d0d0d0"/><rect x="40" y="300" width="700" height="48" rx="9" fill="#f6f8fa"/><rect x="40" y="333" width="700" height="15" fill="#f6f8fa"/><text x="62" y="330" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#222">Files changed</text><rect x="58" y="367" width="664" height="35" rx="4" fill="#f1f8f1"/><text x="75" y="390" font-family="monospace" font-size="15" fill="#236e37">+ Add featured project card and link</text><rect x="58" y="408" width="664" height="35" rx="4" fill="#f1f8f1"/><text x="75" y="431" font-family="monospace" font-size="15" fill="#236e37">+ Add mobile-friendly card spacing</text><text x="58" y="472" font-family="Arial,sans-serif" font-size="13" fill="#666">Review the changed lines before merging.</text><rect x="780" y="300" width="380" height="192" rx="9" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><text x="805" y="335" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#222">Review checklist</text><text x="805" y="371" font-family="Arial,sans-serif" font-size="15" fill="#222">✓ Meets the issue criteria</text><text x="805" y="402" font-family="Arial,sans-serif" font-size="15" fill="#222">✓ Links work</text><text x="805" y="433" font-family="Arial,sans-serif" font-size="15" fill="#222">✓ Looks good on mobile</text><text x="805" y="464" font-family="Arial,sans-serif" font-size="15" fill="#222">✓ No unrelated changes</text><rect x="780" y="514" width="380" height="58" rx="8" fill="#1f883d"/><text x="830" y="550" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">✓ Merge pull request</text><text x="40" y="620" font-family="Arial,sans-serif" font-size="13" fill="#666">CUSTOM LEARNING ILLUSTRATION · GITHUB UI MAY CHANGE</text></svg>