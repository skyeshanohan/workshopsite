<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Illustration of VS Code Source Control</title><desc id="d">A custom VS Code-like screen highlights changed files, a commit message field, and the commit button.</desc><rect width="1200" height="640" rx="16" fill="#1f1f1f"/><rect width="1200" height="55" rx="16" fill="#333"/><rect y="40" width="1200" height="15" fill="#333"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="17" fill="#eee">Visual Studio Code — my-resume-site</text><rect x="0" y="55" width="65" height="540" fill="#252526"/><text x="22" y="99" font-family="Arial,sans-serif" font-size="23" fill="#ddd">▦</text><text x="22" y="149" font-family="Arial,sans-serif" font-size="23" fill="#ddd">⌕</text><rect x="9" y="172" width="46" height="42" rx="5" fill="#444"/><text x="23" y="200" font-family="Arial,sans-serif" font-size="22" fill="#FFDB00">⑂</text><rect x="65" y="55" width="405" height="540" fill="#252526"/><text x="90" y="92" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ddd">SOURCE CONTROL</text><rect x="88" y="118" width="360" height="47" rx="5" fill="#333" stroke="#777"/><text x="104" y="147" font-family="Arial,sans-serif" font-size="14" fill="#aaa">Message (required)</text><rect x="88" y="177" width="360" height="39" rx="5" fill="#FFDB00"/><text x="164" y="202" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#000">✓ Commit</text><text x="91" y="253" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ddd">Changes</text><circle cx="425" cy="248" r="12" fill="#444"/><text x="421" y="253" font-family="Arial,sans-serif" font-size="14" fill="#fff">2</text><rect x="88" y="272" width="360" height="39" rx="5" fill="#333"/><text x="105" y="297" font-family="Arial,sans-serif" font-size="15" fill="#ddd">M  resume.ts</text><rect x="88" y="318" width="360" height="39" rx="5" fill="#333"/><text x="105" y="343" font-family="Arial,sans-serif" font-size="15" fill="#ddd">M  global.css</text><rect x="490" y="55" width="710" height="540" fill="#1e1e1e"/><rect x="490" y="55" width="710" height="45" fill="#2d2d2d"/><text x="515" y="83" font-family="Arial,sans-serif" font-size="15" fill="#fff">resume.ts · Changes</text><rect x="510" y="123" width="667" height="54" rx="4" fill="#1b3227"/><text x="528" y="145" font-family="monospace" font-size="15" fill="#73c991">+ summary: 'MIS student interested in technology'</text><text x="528" y="165" font-family="monospace" font-size="15" fill="#73c991">+ skills: ['SQL', 'Python', 'Git']</text><rect x="510" y="190" width="667" height="54" rx="4" fill="#1b3227"/><text x="528" y="212" font-family="monospace" font-size="15" fill="#73c991">+ featured project and link</text><text x="528" y="232" font-family="monospace" font-size="15" fill="#73c991">+ responsive card styles</text><rect x="82" y="390" width="380" height="142" rx="9" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><text x="101" y="420" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#222">Before you commit</text><text x="101" y="449" font-family="Arial,sans-serif" font-size="15" fill="#222">1. Read the diff.</text><text x="101" y="475" font-family="Arial,sans-serif" font-size="15" fill="#222">2. Write a message that says</text><text x="118" y="496" font-family="Arial,sans-serif" font-size="15" fill="#222">what changed.</text><text x="101" y="519" font-family="Arial,sans-serif" font-size="15" fill="#222">3. Commit only intended files.</text><rect x="65" y="595" width="1135" height="45" fill="#FFDB00"/><text x="88" y="623" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#000">CUSTOM LEARNING ILLUSTRATION · LAYOUT VARIES BY VS CODE VERSION</text></svg>