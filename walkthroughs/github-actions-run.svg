<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Illustration of a successful GitHub Actions run</title><desc id="d">A custom teaching illustration of a workflow with a successful build job, successful deploy job, and a link to the published site.</desc><rect width="1200" height="600" rx="18" fill="#fff"/><rect width="1200" height="68" rx="18" fill="#161616"/><rect y="50" width="1200" height="18" fill="#161616"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">GitHub</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="15" fill="#555">my-resume-site / Actions</text><text x="40" y="157" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#222">Build and deploy portfolio</text><rect x="40" y="181" width="1120" height="58" rx="8" fill="#effaf0" stroke="#a4d4aa" stroke-width="2"/><circle cx="72" cy="210" r="13" fill="#218739"/><path d="M65 210l5 5 9-11" stroke="#fff" stroke-width="3" fill="none"/><text x="98" y="207" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#222">Workflow run successful</text><text x="98" y="228" font-family="Arial,sans-serif" font-size="13" fill="#555">The latest code built and the static site was deployed.</text><text x="40" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#222">Jobs</text><rect x="40" y="302" width="530" height="145" rx="10" fill="#fff" stroke="#d8d8d4" stroke-width="2"/><circle cx="75" cy="339" r="13" fill="#218739"/><path d="M68 339l5 5 9-11" stroke="#fff" stroke-width="3" fill="none"/><text x="102" y="345" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#222">build</text><text x="65" y="383" font-family="Arial,sans-serif" font-size="15" fill="#555">✓ Install dependencies</text><text x="65" y="410" font-family="Arial,sans-serif" font-size="15" fill="#555">✓ Build static site</text><text x="65" y="433" font-family="Arial,sans-serif" font-size="15" fill="#555">✓ Upload Pages artifact</text><path d="M586 375H624" stroke="#777" stroke-width="3"/><path d="M614 364l12 11-12 11" stroke="#777" stroke-width="3" fill="none"/><rect x="640" y="302" width="520" height="145" rx="10" fill="#fff" stroke="#d8d8d4" stroke-width="2"/><circle cx="675" cy="339" r="13" fill="#218739"/><path d="M668 339l5 5 9-11" stroke="#fff" stroke-width="3" fill="none"/><text x="702" y="345" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#222">deploy</text><text x="665" y="383" font-family="Arial,sans-serif" font-size="15" fill="#555">✓ Publish Pages artifact</text><text x="665" y="410" font-family="Arial,sans-serif" font-size="15" fill="#555">✓ Deployment complete</text><rect x="40" y="472" width="1120" height="72" rx="9" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><text x="65" y="502" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#222">Next: open the published URL and test it.</text><text x="65" y="525" font-family="Arial,sans-serif" font-size="14" fill="#444">A green check is useful, but the final check is visiting the real site.</text><text x="40" y="578" font-family="Arial,sans-serif" font-size="13" fill="#666">CUSTOM LEARNING ILLUSTRATION · ACTUAL JOBS AND LABELS MAY VARY</text></svg>