<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Illustration of Copilot Chat in VS Code</title><desc id="d">A custom illustration shows a student prompt in a Copilot chat panel and a response planning a small change.</desc><rect width="1200" height="640" rx="16" fill="#1e1e1e"/><rect width="1200" height="55" rx="16" fill="#333"/><rect y="40" width="1200" height="15" fill="#333"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="17" fill="#eee">Visual Studio Code</text><text x="1170" y="34" font-family="Arial,sans-serif" font-size="15" fill="#ccc" text-anchor="end">— □ ×</text><rect x="0" y="55" width="61" height="540" fill="#252526"/><text x="22" y="96" font-family="Arial,sans-serif" font-size="24" fill="#ddd">▦</text><text x="22" y="143" font-family="Arial,sans-serif" font-size="24" fill="#ddd">⌕</text><rect x="8" y="166" width="45" height="43" rx="5" fill="#444"/><text x="22" y="195" font-family="Arial,sans-serif" font-size="24" fill="#FFDB00">✦</text><rect x="61" y="55" width="655" height="540" fill="#1e1e1e"/><rect x="61" y="55" width="655" height="45" fill="#2d2d2d"/><text x="87" y="83" font-family="Arial,sans-serif" font-size="16" fill="#fff">resume.ts</text><text x="92" y="143" font-family="monospace" font-size="18" fill="#888">1</text><text x="124" y="143" font-family="monospace" font-size="18" fill="#9cdcfe">export const resume = {</text><text x="92" y="181" font-family="monospace" font-size="18" fill="#888">2</text><text x="124" y="181" font-family="monospace" font-size="18" fill="#dcdcaa">  name: </text><text x="235" y="181" font-family="monospace" font-size="18" fill="#ce9178">'Your Name'</text><text x="92" y="219" font-family="monospace" font-size="18" fill="#888">3</text><text x="124" y="219" font-family="monospace" font-size="18" fill="#dcdcaa">  projects: []</text><text x="92" y="257" font-family="monospace" font-size="18" fill="#888">4</text><text x="124" y="257" font-family="monospace" font-size="18" fill="#9cdcfe">};</text><path d="M740 55V595" stroke="#555" stroke-width="2"/><rect x="740" y="55" width="460" height="540" fill="#202020"/><rect x="740" y="55" width="460" height="49" fill="#2b2b2b"/><text x="765" y="86" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#FFDB00">✦ Copilot Chat</text><text x="1170" y="85" font-family="Arial,sans-serif" font-size="20" fill="#ddd">⋯</text><text x="765" y="134" font-family="Arial,sans-serif" font-size="14" fill="#ccc">Try a small, specific request.</text><rect x="765" y="151" width="410" height="150" rx="9" fill="#343434" stroke="#777"/><text x="784" y="181" font-family="Arial,sans-serif" font-size="15" fill="#fff">Please add one project card to the</text><text x="784" y="206" font-family="Arial,sans-serif" font-size="15" fill="#fff">portfolio. Include a title, short summary,</text><text x="784" y="231" font-family="Arial,sans-serif" font-size="15" fill="#fff">skills, and a working link. Keep the</text><text x="784" y="256" font-family="Arial,sans-serif" font-size="15" fill="#fff">existing design. Do not add packages.</text><rect x="765" y="322" width="410" height="195" rx="9" fill="#252525" stroke="#555"/><circle cx="789" cy="348" r="9" fill="#FFDB00"/><text x="808" y="353" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Copilot</text><text x="784" y="383" font-family="Arial,sans-serif" font-size="14" fill="#ddd">I’ll inspect the current project structure</text><text x="784" y="406" font-family="Arial,sans-serif" font-size="14" fill="#ddd">and identify the smallest files to change.</text><text x="784" y="441" font-family="Arial,sans-serif" font-size="14" fill="#ddd">Then I’ll summarize the proposed edits</text><text x="784" y="464" font-family="Arial,sans-serif" font-size="14" fill="#ddd">so you can review them before accepting.</text><rect x="765" y="534" width="410" height="42" rx="7" fill="#292929" stroke="#777"/><text x="784" y="560" font-family="Arial,sans-serif" font-size="14" fill="#aaa">Ask Copilot…</text><rect x="61" y="595" width="1139" height="45" fill="#FFDB00"/><text x="82" y="623" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#000">CUSTOM LEARNING ILLUSTRATION · COPILOT UI MAY CHANGE</text></svg>