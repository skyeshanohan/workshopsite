<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Illustration of GitHub new repository form</title><desc id="d">A custom teaching illustration of the Create a new repository form with a repository name field, public visibility option, and Create repository button.</desc><rect width="1200" height="640" rx="18" fill="#fff"/><rect width="1200" height="68" rx="18" fill="#161616"/><rect y="50" width="1200" height="18" fill="#161616"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">GitHub</text><text x="40" y="115" font-family="Arial,sans-serif" font-size="14" fill="#555">Create a new repository</text><text x="40" y="156" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#222">Create a new repository</text><text x="40" y="185" font-family="Arial,sans-serif" font-size="15" fill="#555">A repository stores your project files and the history of your changes.</text><rect x="40" y="212" width="690" height="360" rx="10" fill="#fff" stroke="#ddd"/><text x="68" y="252" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#222">Owner</text><rect x="68" y="267" width="220" height="42" rx="6" fill="#fff" stroke="#aaa"/><text x="84" y="294" font-family="Arial,sans-serif" font-size="15" fill="#333">your-account ▾</text><text x="308" y="294" font-family="Arial,sans-serif" font-size="22" fill="#666">/</text><text x="68" y="345" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#222">Repository name</text><rect x="68" y="360" width="620" height="48" rx="6" fill="#fff" stroke="#222" stroke-width="2"/><text x="86" y="390" font-family="Arial,sans-serif" font-size="17" fill="#222">my-resume-site</text><rect x="68" y="427" width="620" height="84" rx="8" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><circle cx="95" cy="454" r="10" fill="#FFDB00" stroke="#222"/><circle cx="95" cy="454" r="4" fill="#222"/><text x="118" y="459" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#222">Public</text><text x="118" y="483" font-family="Arial,sans-serif" font-size="14" fill="#444">Anyone can view the repository and the files you publish.</text><rect x="754" y="212" width="406" height="230" rx="10" fill="#f7f7f5" stroke="#ddd"/><text x="784" y="250" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#222">Before you create it</text><text x="784" y="289" font-family="Arial,sans-serif" font-size="15" fill="#444">✓ Choose a simple name</text><text x="784" y="322" font-family="Arial,sans-serif" font-size="15" fill="#444">✓ Choose visibility deliberately</text><text x="784" y="355" font-family="Arial,sans-serif" font-size="15" fill="#444">✓ Leave it empty for now</text><text x="784" y="388" font-family="Arial,sans-serif" font-size="15" fill="#444">✓ Follow the workshop guide</text><rect x="754" y="463" width="406" height="65" rx="8" fill="#1f883d"/><text x="855" y="503" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Create repository</text><text x="40" y="610" font-family="Arial,sans-serif" font-size="13" fill="#666">CUSTOM LEARNING ILLUSTRATION · GITHUB MAY UPDATE ITS FORM</text></svg>