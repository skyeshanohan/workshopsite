<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Illustration of GitHub Pages settings</title><desc id="d">A custom teaching illustration points to repository Settings, Pages, GitHub Actions source, and a successful deployment.</desc><rect width="1200" height="640" rx="16" fill="#fff"/><rect width="1200" height="65" rx="16" fill="#171717"/><rect y="48" width="1200" height="17" fill="#171717"/><text x="28" y="41" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">GitHub</text><text x="40" y="111" font-family="Arial,sans-serif" font-size="16" fill="#555">my-resume-site / Settings</text><rect x="40" y="140" width="245" height="420" rx="9" fill="#f6f8fa" stroke="#ddd"/><text x="62" y="178" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#222">Settings</text><text x="62" y="220" font-family="Arial,sans-serif" font-size="15" fill="#555">General</text><text x="62" y="260" font-family="Arial,sans-serif" font-size="15" fill="#555">Collaborators</text><rect x="50" y="280" width="225" height="42" rx="5" fill="#fff0a6"/><text x="68" y="307" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#222">Pages</text><text x="62" y="365" font-family="Arial,sans-serif" font-size="15" fill="#555">Environments</text><text x="62" y="405" font-family="Arial,sans-serif" font-size="15" fill="#555">Secrets and variables</text><text x="325" y="165" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#222">Pages</text><text x="325" y="200" font-family="Arial,sans-serif" font-size="16" fill="#555">Build and deployment</text><text x="325" y="244" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#222">Source</text><rect x="325" y="260" width="570" height="54" rx="7" fill="#fff" stroke="#999" stroke-width="2"/><text x="347" y="294" font-family="Arial,sans-serif" font-size="17" fill="#222">GitHub Actions</text><text x="865" y="294" font-family="Arial,sans-serif" font-size="17" fill="#555">⌄</text><rect x="325" y="344" width="820" height="98" rx="9" fill="#f5fdf6" stroke="#9acba2" stroke-width="2"/><circle cx="357" cy="379" r="12" fill="#218739"/><path d="M351 379l4 4 8-9" stroke="#fff" stroke-width="2.5" fill="none"/><text x="382" y="379" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#222">Build and deploy workshop site</text><text x="382" y="408" font-family="Arial,sans-serif" font-size="14" fill="#555">Workflow: .github/workflows/deploy.yml</text><rect x="325" y="464" width="820" height="84" rx="9" fill="#fff8cc" stroke="#d1aa00" stroke-width="2"/><text x="350" y="496" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#222">After deployment succeeds, open the published URL.</text><text x="350" y="524" font-family="Arial,sans-serif" font-size="15" fill="#333">Project sites normally include /repository-name/ after the domain.</text><text x="40" y="620" font-family="Arial,sans-serif" font-size="13" fill="#666">CUSTOM LEARNING ILLUSTRATION · SETTINGS MAY VARY BY REPOSITORY</text></svg>