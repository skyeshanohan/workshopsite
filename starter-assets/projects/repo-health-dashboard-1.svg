<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Repo health dashboard concept">
  <rect width="1200" height="720" fill="#f3f3f3"/>
  <rect width="260" height="720" fill="#000"/>
  <text x="36" y="70" fill="#ffdb00" font-family="Arial, sans-serif" font-size="22" font-weight="700">Repo Health</text>
  <text x="36" y="130" fill="#aaa" font-family="Arial, sans-serif" font-size="16">Overview</text>
  <text x="36" y="170" fill="#fff" font-family="Arial, sans-serif" font-size="16">Repositories</text>
  <text x="36" y="210" fill="#aaa" font-family="Arial, sans-serif" font-size="16">Alerts</text>
  <text x="36" y="250" fill="#aaa" font-family="Arial, sans-serif" font-size="16">Owners</text>
  <rect x="300" y="40" width="280" height="140" rx="10" fill="#fff" stroke="#ddd"/>
  <text x="330" y="90" fill="#666" font-family="Arial, sans-serif" font-size="16">Open alerts</text>
  <text x="330" y="140" fill="#111" font-family="Arial, sans-serif" font-size="42" font-weight="700">18</text>
